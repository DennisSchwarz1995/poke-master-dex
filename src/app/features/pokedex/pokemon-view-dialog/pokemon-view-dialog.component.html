<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"
  role="dialog"
  aria-modal="true"
  (click)="close()"
>
  <div
    class="bg-surface border border-theme rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden relative"
    (click)="$event.stopPropagation()"
  >
    @if (pokemon()) {
      <div class="p-6 pb-4 relative flex-none border-b border-theme bg-surface z-20">
        <div class="flex items-start justify-between">
          <app-pokemon-view-header
            class="flex-1"
            [pokemon]="pokemon()"
            [pokemonData]="pokemonData()"
            [spriteUrl]="spriteUrl()"
            [localizedName]="localizedName()"
            [originMark]="originMark()"
          />
          <button
            (click)="close()"
            class="text-secondary hover:text-primary transition-colors text-2xl leading-none block ml-4"
            aria-label="Close dialog"
          >
            <div class="flex p-1 rounded-full hover:bg-surface-hover">
              <app-icon name="close" size="0.75em"></app-icon>
            </div>
          </button>
        </div>
      </div>

      <div class="flex flex-1 overflow-hidden bg-tertiary">
        <app-dialog-sidebar
          [activeTabIndex]="activeTabIndex()"
          (tabChange)="activeTabIndex.set($event)"
        ></app-dialog-sidebar>

        <div class="flex-1 relative overflow-hidden bg-secondary/5">
          @if (pokemon().pokemonSlug) {
            <div
              class="flex transition-transform duration-300 ease-in-out h-full w-full"
              [style.transform]="'translateX(-' + activeTabIndex() * 100 + '%)'"
            >
              <div class="w-full shrink-0 overflow-y-auto custom-scrollbar p-6 h-full">
                <app-pokemon-view-general
                  [pokemon]="pokemon()"
                  [localizedGenus]="localizedGenus()"
                  [natureName]="natureName()"
                  [size]="size()"
                  [pokemonData]="pokemonData()"
                >
                </app-pokemon-view-general>
              </div>
              <div class="w-full shrink-0 overflow-y-auto custom-scrollbar p-6 h-full">
                <app-pokemon-view-moves
                  [pokemon]="pokemon()"
                  [allMoves]="allMoves()"
                ></app-pokemon-view-moves>
              </div>
              <div class="w-full shrink-0 overflow-y-auto custom-scrollbar p-6 h-full">
                <app-pokemon-view-stats
                  [pokemon]="pokemon()"
                  [pokemonData]="pokemonData()!"
                ></app-pokemon-view-stats>
              </div>
              <div class="w-full shrink-0 overflow-y-auto custom-scrollbar p-6 h-full">
                <app-pokemon-view-origin
                  [pokemon]="pokemon()"
                  [originGameName]="originGameName()"
                  [originGameIcon]="originGameIcon()"
                  [storedInGameName]="storedInGameName()"
                  [storedInGameIcon]="storedInGameIcon()"
                ></app-pokemon-view-origin>
              </div>
              <div class="w-full shrink-0 overflow-y-auto custom-scrollbar p-6 h-full">
                <app-pokemon-view-ribbons
                  [pokemon]="pokemon()"
                  [equippedRibbons]="equippedRibbons()"
                  [equippedMarks]="equippedMarks()"
                >
                </app-pokemon-view-ribbons>
              </div>
            </div>
          } @else {
            <div class="w-full h-full flex flex-col items-center justify-center text-tertiary">
              <p class="text-lg">This slot is empty.</p>
            </div>
          }
        </div>
      </div>

      <div class="p-4 border-t border-theme bg-surface flex justify-between items-center z-20">
        <div class="flex gap-2">
          <button
            class="px-3 py-1.5 border border-theme rounded-lg bg-surface-hover text-secondary hover:text-primary transition-all font-semibold hover:bg-theme"
            (click)="previous.emit()"
            [appTooltip]="'Previous Pokémon'"
            tooltipPosition="top"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              ></path>
            </svg>
          </button>
          <button
            class="px-3 py-1.5 border border-theme rounded-lg bg-surface-hover text-secondary hover:text-primary transition-all font-semibold hover:bg-theme"
            (click)="next.emit()"
            [appTooltip]="'Next Pokémon'"
            tooltipPosition="top"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5l7 7-7 7"
              ></path>
            </svg>
          </button>
        </div>
        <div class="flex gap-3">
          <button
            class="px-5 py-1.5 border border-theme rounded-lg bg-surface-hover text-secondary hover:text-primary transition-all font-semibold hover:bg-theme"
            (click)="edit.emit(activeTabIndex())"
          >
            Edit
          </button>
        </div>
      </div>
    }
  </div>
</div>
